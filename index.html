<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Motion Design</title>
  <meta name="description" content="Ролики моушен-дизайнеров по задачам Notion: день, неделя, месяц, год.">
  <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <main class="main" id="app" aria-busy="true">
    <section class="dash">
      <!-- top: the Appbooster logo on the left (appbooster.com/assets/main/logo.svg in one colour); the period tabs grow
           out of the sheet on the right, the range sits inside the open one -->
      <header class="dash-top">

09.145 0.275954 113.056 4.18846 113.056 9.01478C113.056 13.8411 109.145 17.7536 104.321 17.7536H82.4847C77.6607 17.7536 73.75 13.8411 73.75 9.01478ZM82.4847 4.64537H104.321C106.733 4.64537 108.689 6.60162 108.689 9.01478C108.689 11.4279 106.733 13.3842 104.321 13.3842H82.4847C80.0727 13.3842 78.1173 11.4279 78.1173 9.01478C78.1173 6.60162 80.0727 4.64537 82.4847 4.64537Z" fill="currentColor"/><path fill-rule="evenodd" clip-rule="evenodd" d="M25.5228 17.6662C25.8116 17.6662 26.0559 17.4218 26.0559 17.1329V14.1773C26.0559 13.9329 26.2558 13.7329 26.5001 13.7329H29.2544C33.8522 13.7329 36.0512 10.644 36.0512 6.97733C36.0512 3.48845 33.8522 0.33289 29.2544 0.33289H22.1466C21.8579 0.33289 21.6136 0.577334 21.6136 0.866223V17.1329C21.6136 17.4218 21.8579 17.6662 22.1466 17.6662H25.5228ZM31.5644 6.99956C31.5644 8.53289 30.8758 9.68845 29.0101 9.68845H26.5001C26.2558 9.68845 26.0559 9.48845 26.0559 9.244V4.82178C26.0559 4.57733 26.2558 4.37733 26.5001 4.37733H29.0101C30.8758 4.37733 31.5644 5.62178 31.5644 6.99956Z" fill="currentColor"/><path fill-rule="evenodd" clip-rule="evenodd" d="M42.8827 17.6662C43.1714 17.6662 43.4157 17.4218 43.4157 17.1329V14.1773C43.4157 13.9329 43.6156 13.7329 43.86 13.7329H46.6142C51.2121 13.7329 53.411 10.644 53.411 6.97733C53.411 3.48845 51.2121 0.33289 46.6142 0.33289H39.5065C39.2177 0.33289 38.9734 0.577334 38.9734 0.866223V17.1329C38.9734 17.4218 39.2177 17.6662 39.5065 17.6662H42.8827ZM48.9242 6.99956C48.9242 8.53289 48.2357 9.68845 46.3699 9.68845H43.86C43.6156 9.68845 43.4157 9.48845 43.4157 9.244V4.82178C43.4157 4.57733 43.6156 4.37733 43.86 4.37733H46.3699C48.2357 4.37733 48.9242 5.62178 48.9242 6.99956Z" fill="currentColor"/><path d="M8.5417 1.08667C9.06169 0.14344 10.4145 0.137151 10.9432 1.0755L19.5765 16.3973C19.987 17.126 19.2105 18.0032 18.4263 17.7133C16.0993 16.8528 12.546 15.7401 9.73246 15.7401C6.19544 15.7401 4.6767 16.9093 4.16675 17.4446C4.86953 16.6108 7.20776 14.0465 9.73246 13.5942C10.5186 13.4534 11.5302 13.4797 12.2228 13.5243C12.549 13.5454 12.7776 13.1859 12.6095 12.9055L10.2493 8.96915C10.0278 8.59986 9.4948 8.59441 9.26586 8.95908L4.65318 16.3067C4.10633 17.1778 3.15035 17.7065 2.1222 17.7065H0.897918C0.215463 17.7065 -0.216814 16.9741 0.112784 16.3762L8.5417 1.08667Z" fill="currentColor"/><path d="M4.16675 17.4446C4.0279 17.6093 3.95289 17.7065 3.95289 17.7065C3.95289 17.7065 4.01538 17.6035 4.16675 17.4446Z" fill="currentColor"/></svg></a>
        <div class="ptabs" role="tablist" aria-label="Период" id="periodTabs">
          <div class="ptab" data-mode="day"><button class="ptab-btn" role="tab" type="button" data-mode="day">День</button></div>
          <div class="ptab" data-mode="week"><button class="ptab-btn" role="tab" type="button" data-mode="week">Неделя</button></div>
          <div class="ptab" data-mode="month"><button class="ptab-btn" role="tab" type="button" data-mode="month">Месяц</button></div>
          <div class="ptab" data-mode="year"><button class="ptab-btn" role="tab" type="button" data-mode="year">Год</button></div>
        </div>
      </header>

      <!-- the range: inside the open period tab; on a phone it moves to the top of the sheet -->
      <div class="range" id="range">
        <button class="rbtn" id="prevPeriod" type="button" aria-label="Предыдущий период"><svg class="ico" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M14.5 6l-6 6 6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <span class="range-label" id="periodLabel" aria-live="polite">—</span>
        <button class="rbtn" id="nextPeriod" type="button" aria-label="Следующий период"><svg class="ico" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9.5 6l6 6-6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>

      <!-- the sheet: lavender board with white plates -->
      <div class="dash-sheet" id="sheet">
        <div class="range-slot" id="rangeSlot"></div>
        <div class="dash-grid" id="dashView">
          <div class="row-a">
            <article class="bcard">
              <div class="bhead">
                <div class="bhead-txt"><h2 class="b-title">Ролики</h2><p class="b-cap" id="aCap">—</p></div>
                <a class="b-open" id="driveLink" href="#" target="_blank" rel="noopener">Drive<svg class="ico16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9.5 6l6 6-6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
              </div>
              <div class="bbody">
                <div class="metric"><span class="m-value" id="aValue">—</span><span class="m-cap" id="aSub">—</span></div>
                <div class="strip">
                  <div class="split" id="split" role="img"></div>
                  <div class="legend" id="splitLegend"></div>
                </div>
              </div>
            </article>

            <article class="bcard">
              <div class="bhead">
                <div class="bhead-txt"><h2 class="b-title" id="bTitle">По дням</h2><p class="b-cap" id="bCap">—</p></div>
              </div>
              <div class="bbody">
                <div class="metric"><span class="m-value" id="bValue">—</span><span class="m-cap" id="bSub">—</span></div>
                <div class="strip">
                  <div class="bars" id="bars"></div>
                  <div class="strip-ends"><span id="barsFrom">—</span><span id="barsTo">—</span></div>
                </div>
              </div>
            </article>

            <article class="bcard">
              <div class="bhead">
                <div class="bhead-txt"><h2 class="b-title">В работе</h2><p class="b-cap">Задачи, которые сейчас не&nbsp;закрыты</p></div>
                <a class="b-open" id="notionLink" href="#" target="_blank" rel="noopener">Notion<svg class="ico16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9.5 6l6 6-6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
              </div>
              <div class="bbody">
                <div class="metric"><span class="m-value" id="cValue">—</span><span class="m-cap" id="cSub">—</span></div>
                <div class="worklist" id="worklist"></div>
              </div>
            </article>
          </div>

          <div class="row-b">
            <article class="bcard">
              <div class="bhead">
                <div class="bhead-txt"><h2 class="b-title">Направления</h2><p class="b-cap">Плитка оставляет на&nbsp;странице одно&nbsp;направление</p></div>
              </div>
              <div class="tiles" id="dirTiles"></div>
            </article>

            <article class="bcard">
              <div class="bhead">
                <div class="bhead-txt"><h2 class="b-title">Моушены</h2><p class="b-cap">Ролики и&nbsp;задачи за&nbsp;период</p></div>
              </div>
              <div class="tiles" id="personTiles"></div>
            </article>
          </div>

          <article class="bcard dc-log">
            <div class="bhead">
              <div class="bhead-txt"><h2 class="b-title">Последние ролики</h2><p class="b-cap">Задачи, в&nbsp;которых появились&nbsp;ролики</p></div>
            </div>
            <div class="events" id="events"></div>
          </article>
        </div>
        <!-- the tasks page: opened from «Последние ролики», the period on top still drives it -->
        <div class="tview" id="tasksView" hidden>
          <div class="ftabs" role="tablist" aria-label="Задачи" id="taskTabs">
            <button class="ftab" role="tab" type="button" data-tab="done">С роликами<span class="ftab-n" id="nDone"></span></button>
            <button class="ftab" role="tab" type="button" data-tab="current">В работе<span class="ftab-n" id="nCurrent"></span></button>
            <button class="ftab" role="tab" type="button" data-tab="nolink">Без роликов<span class="ftab-n" id="nNolink"></span></button>
          </div>
          <article class="tcard" id="tcard">
            <div class="toolbar">
              <button class="backbtn" id="backBtn" type="button" aria-label="Назад к дашборду" title="Назад к дашборду"><svg class="ico" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
              <label class="field">
                <svg class="ico" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M16.4 16.4L20 20" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="1.5"/></svg>
                <input id="taskSearch" type="search" placeholder="Поиск задачи" aria-label="Поиск задачи" autocomplete="off">
              </label>
              <div class="dd" id="dirFilter" data-label="Направление"></div>
              <div class="dd" id="personFilter" data-label="Моушен"></div>
            </div>
            <div class="tbl"><div class="tgrid" id="tgrid" role="table" aria-label="Задачи"></div></div>
            <p class="tempty" id="tEmpty" hidden></p>
          </article>
        </div>
      </div>
    </section>
  </main>
  <div class="tooltip" id="tooltip" role="status" hidden></div>
  <script src="assets/app.js" type="module"></script>
</body>
</html>
